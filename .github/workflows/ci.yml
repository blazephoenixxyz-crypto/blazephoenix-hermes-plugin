name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      # The plugin itself is stdlib-only; the pins are test-only (eth-abi and pycryptodome are the
      # independent references of the differential tests; the `agent` host module is stubbed in tests/conftest.py).
      - run: python -m pip install -r tests/requirements.txt
      # A skipped offline test is a hole, not a pass: fail if anything is skipped.
      - run: |
          python -m pytest tests/test_offline.py -q -rs | tee pytest.out
          ! grep -Eq "[0-9]+ skipped" pytest.out

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - run: python -m pip install -r tests/requirements.txt
      # Fails if any mutant outside KNOWN_ALIVE survives (see tests/mutants.py).
      - run: python tests/mutants.py
